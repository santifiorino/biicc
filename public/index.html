<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2c2428;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
      }
      .container {
        text-align: center;
        max-width: 600px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 12px 0;
        font-size: 40px;
      }
      p {
        margin: 0 0 24px 0;
        opacity: 0.9;
      }
      a.button {
        display: inline-block;
        padding: 12px 20px;
        background: #7c5cff;
        color: #fff;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      }
      a.button:hover {
        background: #6a4cf0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome</h1>
      <p>Sample description</p>
      <a class="button" href="/controller">Enter</a>
    </div>
  </body>
  </html>
